services:
  fieldassist:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./database:/app/database
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"
      interval: 10s
      timeout: 3s
      retries: 3
